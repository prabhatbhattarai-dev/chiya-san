<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiya San | Online Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: '#0e7490', brandDark: '#155e75', lightBg: '#f8fafc' } } }
    }
  </script>
</head>
<body class="bg-lightBg text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-brand flex items-center gap-2">☕ Chiya San</h1>
      <button onclick="toggleCart()" class="relative bg-brand text-white px-4 py-2 rounded-lg font-semibold hover:bg-brandDark transition-all">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-6xl mx-auto px-4 py-8 w-full grid md:grid-cols-3 gap-8">
    
    <!-- Menu Section -->
    <section class="md:col-span-2 space-y-6">
      <h2 class="text-2xl font-bold text-slate-900 border-b pb-2">Select Your Items</h2>
      <div id="menu-container" class="grid sm:grid-cols-2 gap-4">
        <!-- Injected dynamically via JS -->
      </div>
    </section>

    <!-- Side Cart View (Desktop) -->
    <aside class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm h-fit sticky top-24">
      <h3 class="text-xl font-bold text-slate-900 mb-4 border-b pb-2">Your Order Summary</h3>
      <div id="cart-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto">
        <p class="text-slate-400 text-sm text-center py-4">Your cart is empty</p>
      </div>
      <div class="border-t pt-4 space-y-2">
        <div class="flex justify-between font-semibold text-slate-700">
          <span>Subtotal</span>
          <span>Rs. <span id="cart-subtotal">0</span></span>
        </div>
        <button onclick="openCheckout()" id="checkout-btn" disabled class="w-full mt-4 bg-emerald-600 disabled:bg-slate-300 text-white font-bold py-3 rounded-xl transition-all">
          Proceed to Checkout
        </button>
      </div>
    </aside>
  </main>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl">
      <h3 class="text-xl font-bold text-slate-900 mb-4">Complete Your Order</h3>
      <form id="order-form" onsubmit="handlePlaceOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Your Name</label>
          <input type="text" id="cust-name" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Phone Number</label>
          <input type="tel" id="cust-phone" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Order Type</label>
          <select id="order-type" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand outline-none">
            <option value="Takeaway">Takeaway / Pick-up</option>
            <option value="Dine-in">Dine-in (At Table)</option>
          </select>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="closeCheckout()" class="px-4 py-2 border rounded-lg font-semibold text-slate-600">Cancel</button>
          <button type="submit" class="px-6 py-2 bg-brand text-white font-bold rounded-lg hover:bg-brandDark">Confirm Order</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const menuData = [
      { id: 1, name: "Masala Milk Tea", price: 65, cat: "Beverages" },
      { id: 2, name: "Hot Lemon with Ginger Honey", price: 120, cat: "Beverages" },
      { id: 3, name: "Chicken Steam Momo", price: 200, cat: "Food" },
      { id: 4, name: "Chicken Kothey Momo", price: 250, cat: "Food" },
      { id: 5, name: "French Fries", price: 180, cat: "Snacks" },
      { id: 6, name: "Chicken Chilly", price: 300, cat: "Snacks" }
    ];

    let cart = [];

    function initMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = menuData.map(item => `
        <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex flex-col justify-between">
          <div>
            <span class="text-xs text-brand font-semibold uppercase tracking-wider">${item.cat}</span>
            <h4 class="font-bold text-slate-800 text-lg">${item.name}</h4>
            <p class="text-slate-600 font-bold mt-1">Rs. ${item.price}</p>
          </div>
          <button onclick="addToCart(${item.id})" class="mt-4 bg-slate-100 hover:bg-brand hover:text-white text-slate-800 text-sm font-semibold py-2 rounded-lg transition-all">
            + Add to Order
          </button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menuData.find(m => m.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const cartItemsEl = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const subtotalEl = document.getElementById('cart-subtotal');
      const checkoutBtn = document.getElementById('checkout-btn');

      const totalQty = cart.reduce((acc, curr) => acc + curr.qty, 0);
      const totalAmount = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

      countEl.innerText = totalQty;
      subtotalEl.innerText = totalAmount;
      checkoutBtn.disabled = cart.length === 0;

      if (cart.length === 0) {
        cartItemsEl.innerHTML = `<p class="text-slate-400 text-sm text-center py-4">Your cart is empty</p>`;
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center text-sm border-b pb-2">
          <div>
            <p class="font-semibold text-slate-800">${item.name}</p>
            <p class="text-slate-500">Rs. ${item.price} × ${item.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${item.id}, -1)" class="px-2 py-0.5 bg-slate-200 rounded font-bold">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="px-2 py-0.5 bg-slate-200 rounded font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
      }
      updateCartUI();
    }

    function openCheckout() { document.getElementById('checkout-modal').classList.remove('hidden'); document.getElementById('checkout-modal').classList.add('flex'); }
    function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); document.getElementById('checkout-modal').classList.remove('flex'); }

    function handlePlaceOrder(e) {
      e.preventDefault();
      const orderPayload = {
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        type: document.getElementById('order-type').value,
        items: cart,
        total: cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0)
      };
      
      alert(`Order Placed Successfully! Total: Rs. ${orderPayload.total}. Thank you, ${orderPayload.name}.`);
      cart = [];
      updateCartUI();
      closeCheckout();
    }

    initMenu();
  </script>
</body>
</html>
