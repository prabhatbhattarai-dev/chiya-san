<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiya San | Order Online</title>
  <style>
    :root {
      --primary-color: #2c5e3b;
      --accent-color: #25D366;
      --bg-color: #f4f6f4;
      --text-color: #333;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px 30px 15px;
    }
    h2 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      color: var(--primary-color);
      margin-top: 25px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .menu-item {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .menu-item h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
    }
    .menu-item p {
      margin: 0 0 10px 0;
      color: #666;
      font-size: 13px;
    }
    .price {
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 15px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .cart-section, .checkout-section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    ul.cart-list {
      list-style: none;
      padding: 0;
      margin: 0 0 15px 0;
    }
    ul.cart-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .whatsapp-btn {
      background-color: var(--accent-color);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .whatsapp-btn:hover {
      background-color: #128C7E;
    }
    .remove-btn {
      background-color: #ff4d4d;
      padding: 4px 8px;
      font-size: 12px;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍵 Chiya San</h1>
    <p>Select items, enter your details, and place your order directly via WhatsApp!</p>
  </header>

  <div class="container">
    
    <!-- Menu Section -->
    <h2>Our Menu</h2>
    <div class="menu-grid" id="menuGrid">
      <!-- Generated via JavaScript -->
    </div>

    <!-- Cart Section -->
    <div class="cart-section">
      <h2>Your Cart</h2>
      <ul class="cart-list" id="cartList">
        <li style="color: #888;">Your cart is empty.</li>
      </ul>
      <div style="font-weight: bold; font-size: 18px; text-align: right;" id="cartTotal">Total: Rs. 0</div>
    </div>

    <!-- Customer Checkout Details -->
    <div class="checkout-section">
      <h2>Order Details</h2>
      <form id="orderForm" onsubmit="event.preventDefault(); sendToWhatsApp();">
        <div class="form-group">
          <label for="customerName">Your Name:</label>
          <input type="text" id="customerName" required placeholder="e.g. Prabhat Bhattarai">
        </div>

        <div class="form-group">
          <label for="orderType">Order Type:</label>
          <select id="orderType" onchange="toggleAddressField()">
            <option value="Dine-In">Dine-In</option>
            <option value="Takeaway">Takeaway / Pick-up</option>
            <option value="Delivery">Home Delivery</option>
          </select>
        </div>

        <div class="form-group" id="locationGroup">
          <label id="locationLabel" for="locationDetails">Table Number:</label>
          <input type="text" id="locationDetails" required placeholder="e.g. Table 3">
        </div>

        <button type="submit" class="whatsapp-btn">Send Order via WhatsApp 💬</button>
      </form>
    </div>

  </div>

  <script>
    // 1. Menu Items Definition
    const menuItems = [
      { id: 1, name: "Special Milk Chiya", price: 50, desc: "Traditional spiced brewed milk tea" },
      { id: 2, name: "Black Tea (Kalo Chiya)", price: 30, desc: "Fresh lemon and herbal tea" },
      { id: 3, name: "Masala Chiya", price: 70, desc: "Loaded with aromatic Himalayan spices" },
      { id: 4, name: "Iced Cold Chiya", price: 120, desc: "Refreshing chilled milk tea over ice" },
      { id: 5, name: "Veg Momo (Plate)", price: 150, desc: "Steam dumplings with spicy achar" },
      { id: 6, name: "Buff Momo (Plate)", price: 180, desc: "Juicy local buff dumplings" }
    ];

    let cart = [];

    // 2. Render Menu Cards
    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      grid.innerHTML = '';
      menuItems.forEach(item => {
        grid.innerHTML += `
          <div class="menu-item">
            <div>
              <h3>${item.name}</h3>
              <p>${item.desc}</p>
              <div class="price">Rs. ${item.price}</div>
            </div>
            <button onclick="addToCart(${item.id})">+ Add to Cart</button>
          </div>
        `;
      });
    }

    // 3. Cart Management Functions
    function addToCart(id) {
      const product = menuItems.find(p => p.id === id);
      const existing = cart.find(p => p.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function removeFromCart(id) {
      cart = cart.filter(p => p.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      const cartList = document.getElementById('cartList');
      const cartTotal = document.getElementById('cartTotal');
      
      if (cart.length === 0) {
        cartList.innerHTML = '<li style="color: #888;">Your cart is empty.</li>';
        cartTotal.innerText = 'Total: Rs. 0';
        return;
      }

      cartList.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        cartList.innerHTML += `
          <li>
            <span>${item.name} (x${item.qty})</span>
            <span>Rs. ${itemTotal} <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button></span>
          </li>
        `;
      });

      cartTotal.innerText = `Total: Rs. ${total}`;
    }

    // 4. Form Field Toggling based on Order Type
    function toggleAddressField() {
      const type = document.getElementById('orderType').value;
      const label = document.getElementById('locationLabel');
      const input = document.getElementById('locationDetails');

      if (type === 'Dine-In') {
        label.innerText = 'Table Number:';
        input.placeholder = 'e.g. Table 3';
      } else if (type === 'Takeaway') {
        label.innerText = 'Pickup Time:';
        input.placeholder = 'e.g. Ready in 15 mins';
      } else {
        label.innerText = 'Delivery Address:';
        input.placeholder = 'e.g. Kathmandu / Lalitpur address';
      }
    }

    // 5. Send Order to WhatsApp Function
    function sendToWhatsApp() {
      if (cart.length === 0) {
        alert("Please add at least one item to your cart before sending your order.");
        return;
      }

      const name = document.getElementById('customerName').value;
      const orderType = document.getElementById('orderType').value;
      const location = document.getElementById('locationDetails').value;

      // REPLACE WITH YOUR ACTUAL WHATSAPP PHONE NUMBER
      // Formatted as country code + number without plus signs or hyphens (e.g., 9779800000000)
      const phoneNumber = "9779800000000"; 

      let message = `*NEW ORDER - CHIYA SAN*\n\n` +
                    `👤 *Customer:* ${name}\n` +
                    `📌 *Type:* ${orderType}\n` +
                    `📍 *Details:* ${location}\n\n` +
                    `🛒 *Items Ordered:*\n`;

      let total = 0;
      cart.forEach(item => {
        let itemSum = item.price * item.qty;
        total += itemSum;
        message += `- ${item.name} x${item.qty} = Rs. ${itemSum}\n`;
      });

      message += `\n💰 *Total Amount:* Rs. ${total}`;

      const encodedURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
      window.open(encodedURL, '_blank');
    }

    // Initialize page
    renderMenu();
  </script>
</body>
</html>
