<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiya San | Online Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-cyan-800">☕ Chiya San</h1>
      <button onclick="toggleCartModal()" class="bg-cyan-700 text-white px-4 py-2 rounded-lg font-semibold hover:bg-cyan-800 transition-all">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <!-- Main Menu Grid -->
  <main class="max-w-5xl mx-auto px-4 py-8 w-full">
    <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-2">Order Online</h2>
    <div id="menu-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Items load dynamically -->
    </div>
  </main>

  <!-- Checkout Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl">
      <h3 class="text-xl font-bold text-slate-900 mb-4">Your Order</h3>
      <div id="cart-items" class="space-y-3 mb-4 max-h-48 overflow-y-auto border-b pb-4">
        <p class="text-slate-400 text-sm">Your cart is empty.</p>
      </div>
      <div class="flex justify-between font-bold text-lg mb-4">
        <span>Total:</span>
        <span>Rs. <span id="cart-total">0</span></span>
      </div>
      <form id="order-form" onsubmit="submitOrderToFirebase(event)" class="space-y-3">
        <input type="text" id="cust-name" placeholder="Your Name" required class="w-full border p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-cyan-700">
        <input type="tel" id="cust-phone" placeholder="Phone Number" required class="w-full border p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-cyan-700">
        <select id="cust-type" class="w-full border p-2.5 rounded-lg outline-none">
          <option value="Takeaway">Takeaway</option>
          <option value="Dine-in">Dine-in (Table)</option>
        </select>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleCartModal()" class="w-1/2 border py-2.5 rounded-lg font-semibold">Close</button>
          <button type="submit" id="submit-btn" class="w-1/2 bg-cyan-700 text-white py-2.5 rounded-lg font-bold hover:bg-cyan-800">Place Order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your actual Firebase keys from your console
    const firebaseConfig = {
      apiKey: "AIzaSyB8XHVv0U4GtdnI3U26C10fpGDpnELSdg",
      authDomain: "chiya-san-orders.firebaseapp.com",
      projectId: "chiya-san-orders",
      storageBucket: "chiya-san-orders.firebasestorage.app",
      messagingSenderId: "171390546624",
      appId: "1:171390546624:web:58120d6d4cb7c2e667f325",
      measurementId: "G-9JLY2XD0MG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const menu = [
      { id: 1, name: "Masala Milk Tea", price: 65 },
      { id: 2, name: "Chicken Steam Momo", price: 200 },
      { id: 3, name: "Chicken Kothey Momo", price: 250 },
      { id: 4, name: "French Fries", price: 180 },
      { id: 5, name: "Chicken Chilly", price: 300 }
    ];

    let cart = [];

    window.renderMenu = function() {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = menu.map(item => `
        <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm flex flex-col justify-between">
          <div>
            <h4 class="font-bold text-slate-800 text-lg">${item.name}</h4>
            <p class="text-cyan-800 font-bold mt-1">Rs. ${item.price}</p>
          </div>
          <button onclick="addToCart(${item.id})" class="mt-4 bg-slate-100 hover:bg-cyan-700 hover:text-white font-semibold py-2 rounded-lg transition-all">
            + Add to Order
          </button>
        </div>
      `).join('');
    };

    window.addToCart = function(id) {
      const item = menu.find(m => m.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) existing.qty++;
      else cart.push({ ...item, qty: 1 });
      updateUI();
    };

    function updateUI() {
      document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
      document.getElementById('cart-total').innerText = cart.reduce((a, b) => a + (b.price * b.qty), 0);
      const cartItems = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartItems.innerHTML = `<p class="text-slate-400 text-sm">Your cart is empty.</p>`;
        return;
      }
      cartItems.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center text-sm">
          <span>${item.name} (x${item.qty})</span>
          <span class="font-bold">Rs. ${item.price * item.qty}</span>
        </div>
      `).join('');
    }

    window.toggleCartModal = function() {
      document.getElementById('cart-modal').classList.toggle('hidden');
      document.getElementById('cart-modal').classList.toggle('flex');
    };

    window.submitOrderToFirebase = async function(e) {
      e.preventDefault();
      if (cart.length === 0) return alert("Your cart is empty!");

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Sending...";

      try {
        await addDoc(collection(db, "orders"), {
          customerName: document.getElementById('cust-name').value,
          customerPhone: document.getElementById('cust-phone').value,
          orderType: document.getElementById('cust-type').value,
          items: cart,
          totalAmount: cart.reduce((a, b) => a + (b.price * b.qty), 0),
          status: "Pending",
          createdAt: serverTimestamp()
        });

        alert("Order sent to kitchen!");
        cart = [];
        updateUI();
        toggleCartModal();
      } catch (err) {
        alert("Error sending order: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Place Order";
      }
    };

    renderMenu();
  </script>
</body>
</html>
