<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiya SAN | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { green: '#2D4A3E', lightGreen: '#EBF0EC', terracotta: '#B85B3E', lightTerracotta: '#FDF5F2', cream: '#F9F6F0', dark: '#1A1A1A', } }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], } } } }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .order-card { transition: all 0.2s ease-in-out; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-brand-green text-brand-dark antialiased min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-brand-green z-[9999] flex items-center justify-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md mx-4 text-center">
            <img src="images/logo.png" alt="Chiya San Logo" class="h-24 w-auto mx-auto mb-6 object-contain">
            <h1 class="font-serif font-bold text-2xl text-brand-green mb-2">Admin Dashboard</h1>
            <p class="text-brand-dark/60 text-sm mb-6">Enter password to view orders</p>
            
            <input type="password" id="password" placeholder="Password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-green text-center text-lg tracking-widest mb-4" onkeypress="if(event.key === 'Enter') login()">
            
            <p id="login-error" class="text-red-500 text-sm mb-4 hidden"></p>
            
            <button id="loginBtn" onclick="login()" class="w-full bg-brand-green text-white py-3.5 rounded-xl font-medium hover:bg-brand-green/90 transition shadow-lg shadow-brand-green/20">
                Login
            </button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <nav class="bg-white border-b border-brand-green/10 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center gap-3">
                        <img src="images/logo.png" alt="Logo" class="h-10 w-auto object-contain">
                        <span class="font-serif font-bold text-brand-green text-lg hidden sm:block">Admin Dashboard</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="fetchOrders()" class="flex items-center gap-2 px-4 py-2 bg-brand-lightGreen text-brand-green rounded-full text-sm font-medium hover:bg-brand-green hover:text-white transition">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
                        </button>
                        <button onclick="logout()" class="flex items-center gap-2 px-4 py-2 bg-brand-lightTerracotta text-brand-terracotta rounded-full text-sm font-medium hover:bg-brand-terracotta hover:text-white transition">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Broadcast Section -->
            <div class="bg-white rounded-3xl shadow-sm border border-brand-green/10 p-6 mb-8">
                <div class="flex items-center gap-3 mb-4">
                    <div class="bg-brand-lightGreen p-3 rounded-full"><i data-lucide="megaphone" class="w-6 h-6 text-brand-green"></i></div>
                    <div><h3 class="font-serif font-bold text-xl text-brand-green">WhatsApp Broadcast</h3><p class="text-xs text-brand-dark/60">Send a promotional message to your customers</p></div>
                </div>
                <textarea id="broadcastMsg" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-green text-sm mb-3" placeholder="e.g. 🎉 Happy Hour! 20% off all teas today from 2-4 PM!"></textarea>
                <button onclick="sendBroadcast()" class="bg-brand-green text-white px-6 py-3 rounded-xl font-medium hover:bg-brand-green/90 transition flex items-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> Open WhatsApp Broadcast</button>
            </div>

            <div class="flex justify-between items-end mb-6">
                <div><h2 class="font-serif font-bold text-3xl text-brand-green">Live Orders</h2><p class="text-brand-dark/60 text-sm">Real-time orders from your website</p></div>
                <div class="text-right"><p class="text-sm font-medium text-brand-dark/60">Total Orders: <span id="order-count" class="text-brand-green font-bold">0</span></p></div>
            </div>

            <div id="loading" class="text-center py-20">
                <div class="inline-block w-10 h-10 border-4 border-brand-lightGreen border-t-brand-terracotta rounded-full animate-spin"></div>
                <p class="mt-4 text-brand-dark/50">Loading orders...</p>
            </div>
            <div id="empty-state" class="hidden text-center py-20 bg-white rounded-3xl border border-dashed border-brand-green/20">
                <i data-lucide="inbox" class="w-16 h-16 text-brand-lightGreen mx-auto mb-4"></i>
                <h3 class="text-xl font-medium text-brand-dark/60">No orders yet</h3>
                <p class="text-brand-dark/40 text-sm">New orders will appear here automatically.</p>
            </div>
            <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        
        // ⚠️ IMPORTANT: PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const scriptURL = "https://script.google.com/macros/s/AKfycbwzKD3RhIqMp-_QIXKpdLFEfXwbGxRVstA-IM1SQ2G-r7wH3oUTCFDDbq2xm4ctIQCm/exec"; 

        let adminPassword = "";

        async function login() {
            const passwordInput = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('login-error');

            if (passwordInput.trim() === "") {
                errorDiv.innerText = "Please enter a password.";
                errorDiv.classList.remove('hidden');
                return;
            }

            loginBtn.innerHTML = 'Connecting...';
            loginBtn.disabled = true;
            errorDiv.classList.add('hidden');

            if (scriptURL === "PASTE_YOUR_NEW_GOOGLE_APPS_SCRIPT_URL_HERE") {
                errorDiv.innerText = "Error: You haven't pasted your Google Apps Script URL in the code yet!";
                errorDiv.classList.remove('hidden');
                loginBtn.innerHTML = 'Login';
                loginBtn.disabled = false;
                return;
            }

            try {
                const response = await fetch(`${scriptURL}?password=${encodeURIComponent(passwordInput)}`);
                const data = await response.json();

                if (data.error && data.error.includes("Unauthorized")) {
                    errorDiv.innerText = "Incorrect password. Please try again.";
                    errorDiv.classList.remove('hidden');
                } else if (data.error) {
                    errorDiv.innerText = "Server Error: " + data.error;
                    errorDiv.classList.remove('hidden');
                } else {
                    adminPassword = passwordInput;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    renderOrders(data);
                }
            } catch (error) {
                console.error("Login error:", error);
                errorDiv.innerText = "Failed to connect. Check your internet or the script URL.";
                errorDiv.classList.remove('hidden');
            } finally {
                loginBtn.innerHTML = 'Login';
                loginBtn.disabled = false;
            }
        }

        function logout() {
            adminPassword = "";
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('password').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg) { alert("Please type a message first."); return; }
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function updateOrderStatus(orderId, newStatus) {
            const updateData = { type: 'updateStatus', orderId: orderId, status: newStatus };
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updateData) });
                fetchOrders();
            } catch (error) { console.error('Error updating status:', error); alert("Failed to update status."); }
        }

        async function fetchOrders() {
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            const ordersGrid = document.getElementById('orders-grid');

            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');
            ordersGrid.innerHTML = '';

            try {
                const response = await fetch(`${scriptURL}?password=${encodeURIComponent(adminPassword)}`);
                const data = await response.json();
                loading.classList.add('hidden');
                
                if (data.error) {
                    ordersGrid.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">Error: ${data.error}</div>`;
                    return;
                }
                renderOrders(data);
            } catch (error) {
                loading.classList.add('hidden');
                ordersGrid.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">Failed to load orders.</div>`;
            }
        }

        function renderOrders(data) {
            const emptyState = document.getElementById('empty-state');
            const ordersGrid = document.getElementById('orders-grid');
            const orderCount = document.getElementById('order-count');

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                orderCount.innerText = '0';
                return;
            }
            orderCount.innerText = data.length;

            data.forEach((order) => {
                const date = new Date(order.Timestamp);
                const timeString = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const dateString = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                const formattedItems = order['Items Ordered'].replace(/\n/g, '<br>');
                const card = document.createElement('div');
                card.className = 'order-card bg-white rounded-2xl shadow-sm border border-brand-green/10 p-5 flex flex-col relative overflow-hidden';
                const barColor = order['Order Type'] === 'Dine-In' ? 'bg-brand-green' : 'bg-brand-terracotta';
                
                const currentStatus = order['Status'] || 'Pending';
                let statusBadge = '';
                if (currentStatus === 'Pending') statusBadge = '<span class="bg-red-100 text-red-600 text-xs px-2 py-1 rounded-full font-bold">Pending</span>';
                else if (currentStatus === 'Preparing') statusBadge = '<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-1 rounded-full font-bold">Preparing</span>';
                else if (currentStatus === 'Ready') statusBadge = '<span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-bold">Ready!</span>';
                else statusBadge = '<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full font-bold">Completed</span>';

                let actionButtons = '';
                if (currentStatus === 'Pending') {
                    actionButtons = `<button onclick="updateOrderStatus('${order['Order ID']}', 'Preparing')" class="w-full bg-brand-lightGreen text-brand-green py-2 rounded-lg text-sm font-medium hover:bg-brand-green hover:text-white transition">Start Preparing</button>`;
                } else if (currentStatus === 'Preparing') {
                    actionButtons = `<button onclick="updateOrderStatus('${order['Order ID']}', 'Ready')" class="w-full bg-brand-terracotta text-white py-2 rounded-lg text-sm font-medium hover:bg-brand-terracotta/90 transition">Mark as Ready</button>`;
                } else if (currentStatus === 'Ready') {
                    actionButtons = `<button onclick="updateOrderStatus('${order['Order ID']}', 'Completed')" class="w-full bg-brand-green text-white py-2 rounded-lg text-sm font-medium hover:bg-brand-green/90 transition">Mark as Completed</button>`;
                }

                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-1.5 h-full ${barColor}"></div>
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-xs font-bold text-brand-terracotta tracking-wider">${order['Order ID']}</span>
                            <h3 class="font-serif font-bold text-xl text-brand-green mt-0.5">${order['Customer Name']}</h3>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-medium text-brand-dark/50">${dateString} · ${timeString}</div>
                            <div class="mt-2">${statusBadge}</div>
                        </div>
                    </div>
                    <div class="bg-brand-cream rounded-xl p-3 mb-4 flex-1">
                        <div class="text-xs font-semibold text-brand-dark/50 uppercase tracking-wider mb-2">Items</div>
                        <div class="text-sm text-brand-dark leading-relaxed">${formattedItems}</div>
                    </div>
                    <div class="flex justify-between items-center border-t border-gray-100 pt-3 mt-auto mb-3">
                        <div class="text-xs font-medium text-brand-dark/50">${order['Table / Pickup Time']}</div>
                        <div class="font-bold text-brand-green text-lg">Rs. ${order['Total Amount']}</div>
                    </div>
                    <div class="mt-2">${actionButtons}</div>
                `;
                ordersGrid.appendChild(card);
            });
        }

        setInterval(() => { 
            if (adminPassword !== "" && !document.getElementById('dashboard').classList.contains('hidden')) { 
                fetchOrders(); 
            } 
        }, 60000);
    </script>
</body>
</html>
