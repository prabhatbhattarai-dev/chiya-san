<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiya SAN | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { green: '#2D4A3E', lightGreen: '#EBF0EC', terracotta: '#B85B3E', lightTerracotta: '#FDF5F2', cream: '#F9F6F0', dark: '#1A1A1A', } }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], } } } }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .order-card { transition: all 0.2s ease-in-out; }
        .order-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .preset-msg { transition: all 0.2s ease-in-out; }
        .preset-msg:hover { background-color: #EBF0EC; border-color: #2D4A3E; }
        .preset-msg.active { background-color: #2D4A3E; color: white; border-color: #2D4A3E; }
        .filter-tab { transition: all 0.2s ease-in-out; }
        .filter-tab.active { background-color: #2D4A3E; color: white; }
        .filter-tab:not(.active):hover { background-color: #EBF0EC; }
        .count-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; margin-left: 6px; }
        .filter-tab.active .count-badge { background-color: rgba(255,255,255,0.25); color: white; }
        .filter-tab:not(.active) .count-badge { background-color: #E5E7EB; color: #4B5563; }
        .filter-tab[data-status="pending"].active { background-color: #DC2626; }
        .filter-tab[data-status="preparing"].active { background-color: #CA8A04; }
        .filter-tab[data-status="ready"].active { background-color: #16A34A; }
        .filter-tab[data-status="completed"].active { background-color: #6B7280; }
        
        /* Login Screen Animations */
        .login-bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.08) 1px, transparent 0);
            background-size: 32px 32px;
        }
        @keyframes floatLogin {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float-login {
            animation: floatLogin 4s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-brand-cream text-brand-dark antialiased min-h-screen">

    <!-- ==================== LOGIN SCREEN (Mobile Optimized) ==================== -->
    <div id="login-screen" class="fixed inset-0 bg-brand-green z-[9999] overflow-hidden">
        
        <!-- Decorative Background -->
        <div class="absolute inset-0 login-bg-pattern"></div>
        <div class="absolute -top-32 -right-32 w-96 h-96 bg-brand-terracotta/20 rounded-full blur-3xl animate-pulse-glow"></div>
        <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-brand-lightGreen/10 rounded-full blur-3xl animate-pulse-glow"></div>
        
        <!-- Login Content -->
        <div class="relative h-full flex flex-col items-center justify-center p-5 sm:p-6">
            
            <!-- Logo with floating animation -->
            <div class="mb-8 md:mb-10 animate-float-login">
                <div class="bg-white/95 backdrop-blur-sm p-5 md:p-6 rounded-3xl shadow-2xl">
                    <img src="images/logo.png" alt="Chiya San Logo" class="h-20 md:h-28 w-auto object-contain">
                </div>
            </div>

            <!-- Welcome Text -->
            <div class="text-center mb-8 md:mb-10">
                <h1 class="font-serif font-bold text-3xl md:text-4xl text-white mb-2">Staff Login</h1>
                <p class="text-brand-lightGreen/70 text-sm md:text-base">Chiya San Order Management</p>
            </div>

            <!-- Login Card -->
            <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">
                <!-- Top accent bar -->
                <div class="h-1.5 bg-gradient-to-r from-brand-terracotta via-brand-green to-brand-terracotta"></div>
                
                <div class="p-6 md:p-8">
                    <!-- Input Label -->
                    <label class="block text-sm font-semibold text-brand-dark mb-2">
                        Admin Password
                    </label>
                    
                    <!-- Password Input with Show/Hide Toggle -->
                    <div class="relative mb-4">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-brand-dark/40"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password" 
                            class="w-full pl-12 pr-12 py-4 rounded-2xl border-2 border-gray-200 focus:outline-none focus:border-brand-green focus:ring-4 focus:ring-brand-green/10 text-base font-medium transition-all"
                            onkeypress="if(event.key === 'Enter') login()"
                            autocomplete="current-password"
                        >
                        <button 
                            type="button"
                            onclick="togglePasswordVisibility()" 
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-brand-dark/40 hover:text-brand-green transition"
                            id="togglePasswordBtn"
                        >
                            <i data-lucide="eye" class="w-5 h-5" id="eyeIcon"></i>
                        </button>
                    </div>

                    <!-- Error Message -->
                    <div id="login-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl">
                        <div class="flex items-start gap-2">
                            <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></i>
                            <p id="login-error-text" class="text-red-600 text-sm font-medium"></p>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button 
                        id="loginBtn" 
                        onclick="login()" 
                        class="w-full bg-brand-green text-white py-4 rounded-2xl font-bold text-base hover:bg-brand-green/90 active:scale-[0.98] transition-all shadow-lg shadow-brand-green/30 flex items-center justify-center gap-2"
                    >
                        <i data-lucide="log-in" class="w-5 h-5" id="loginBtnIcon"></i>
                        <span id="loginBtnText">Login to Dashboard</span>
                    </button>

                    <!-- Small Security Notice -->
                    <div class="mt-6 pt-5 border-t border-gray-100">
                        <div class="flex items-center justify-center gap-2 text-xs text-brand-dark/50">
                            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                            <span>Secured with encrypted password verification</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Back to Website Link -->
            <a href="index.html" class="mt-6 md:mt-8 inline-flex items-center gap-2 text-brand-lightGreen/70 hover:text-white text-sm font-medium transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Back to Website</span>
            </a>
        </div>
    </div>

    <!-- ==================== DASHBOARD ==================== -->
    <div id="dashboard" class="hidden pb-12">
        <nav class="bg-white border-b border-brand-green/10 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16 md:h-20">
                    <div class="flex items-center gap-3 md:gap-4">
                        <img src="images/logo.png" alt="Logo" class="h-10 md:h-12 w-auto object-contain">
                        <div class="hidden sm:block">
                            <h1 class="font-serif font-bold text-lg md:text-xl text-brand-green leading-tight">Admin Dashboard</h1>
                            <p class="text-xs text-brand-dark/50">Chiya San Order Management</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 md:gap-3">
                        <button onclick="fetchOrders()" class="flex items-center gap-2 px-4 md:px-5 py-2.5 bg-brand-lightGreen text-brand-green rounded-full text-sm font-semibold hover:bg-brand-green hover:text-white transition shadow-sm">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> <span class="hidden sm:inline">Refresh</span>
                        </button>
                        <button onclick="logout()" class="flex items-center gap-2 px-4 md:px-5 py-2.5 bg-brand-lightTerracotta text-brand-terracotta rounded-full text-sm font-semibold hover:bg-brand-terracotta hover:text-white transition shadow-sm">
                            <i data-lucide="log-out" class="w-4 h-4"></i> <span class="hidden sm:inline">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
            <!-- Broadcast -->
            <div class="bg-white rounded-3xl shadow-sm border border-brand-green/10 mb-6 md:mb-8 overflow-hidden">
                <button onclick="toggleBroadcast()" class="w-full flex items-center justify-between p-5 md:p-6 text-left hover:bg-brand-cream/50 transition">
                    <div class="flex items-center gap-3">
                        <div class="bg-brand-lightGreen p-2.5 md:p-3 rounded-full"><i data-lucide="megaphone" class="w-5 h-5 md:w-6 md:h-6 text-brand-green"></i></div>
                        <div>
                            <h3 class="font-serif font-bold text-base md:text-xl text-brand-green">WhatsApp Broadcast</h3>
                            <p class="text-xs text-brand-dark/50">Send promotional messages to your customers</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-down" id="broadcastChevron" class="w-5 h-5 md:w-6 md:h-6 text-brand-dark/40 transition-transform"></i>
                </button>
                <div id="broadcastContent" class="hidden px-5 md:px-6 pb-5 md:pb-6">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button onclick="filterPresets('all', this)" class="category-tab active px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs font-bold transition bg-brand-green text-white">All</button>
                        <button onclick="filterPresets('greeting', this)" class="category-tab px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs font-bold transition bg-brand-lightGreen text-brand-dark hover:bg-brand-green hover:text-white">👋 Greetings</button>
                        <button onclick="filterPresets('promo', this)" class="category-tab px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs font-bold transition bg-brand-lightGreen text-brand-dark hover:bg-brand-green hover:text-white">🎉 Promo</button>
                        <button onclick="filterPresets('thanks', this)" class="category-tab px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs font-bold transition bg-brand-lightGreen text-brand-dark hover:bg-brand-green hover:text-white">💚 Thank You</button>
                        <button onclick="filterPresets('festival', this)" class="category-tab px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs font-bold transition bg-brand-lightGreen text-brand-dark hover:bg-brand-green hover:text-white">🪔 Festival</button>
                        <button onclick="filterPresets('casual', this)" class="category-tab px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs font-bold transition bg-brand-lightGreen text-brand-dark hover:bg-brand-green hover:text-white">😊 Casual</button>
                    </div>
                    <div id="presetContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4 max-h-56 overflow-y-auto pr-2"></div>
                    <textarea id="broadcastMsg" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-green text-sm bg-brand-cream/50 mb-3" placeholder="Click a template above or type your own message..."></textarea>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <button onclick="sendBroadcast()" class="flex-1 bg-brand-green text-white px-6 py-3 rounded-xl font-medium hover:bg-brand-green/90 transition flex items-center justify-center gap-2 shadow-lg shadow-brand-green/20"><i data-lucide="send" class="w-4 h-4"></i> Open WhatsApp Broadcast</button>
                        <button onclick="clearBroadcast()" class="sm:w-auto bg-gray-100 text-brand-dark px-6 py-3 rounded-xl font-medium hover:bg-gray-200 transition flex items-center justify-center gap-2"><i data-lucide="trash-2" class="w-4 h-4"></i> Clear</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 md:mb-6 gap-3">
                <div>
                    <h2 class="font-serif font-bold text-2xl md:text-3xl text-brand-green">Live Orders</h2>
                    <p class="text-xs md:text-sm text-brand-dark/60">Click a status tab to filter orders</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-brand-green/10 p-2 mb-5 md:mb-6 overflow-x-auto">
                <div class="flex gap-2 min-w-max">
                    <button onclick="filterOrders('all', this)" data-status="all" class="filter-tab active flex items-center px-4 md:px-5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap">
                        <i data-lucide="layers" class="w-4 h-4 mr-2"></i> All <span class="count-badge" id="count-all">0</span>
                    </button>
                    <button onclick="filterOrders('Pending', this)" data-status="pending" class="filter-tab flex items-center px-4 md:px-5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap text-brand-dark">
                        <i data-lucide="clock" class="w-4 h-4 mr-2"></i> Pending <span class="count-badge" id="count-pending">0</span>
                    </button>
                    <button onclick="filterOrders('Preparing', this)" data-status="preparing" class="filter-tab flex items-center px-4 md:px-5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap text-brand-dark">
                        <i data-lucide="chef-hat" class="w-4 h-4 mr-2"></i> Preparing <span class="count-badge" id="count-preparing">0</span>
                    </button>
                    <button onclick="filterOrders('Ready', this)" data-status="ready" class="filter-tab flex items-center px-4 md:px-5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap text-brand-dark">
                        <i data-lucide="check-circle" class="w-4 h-4 mr-2"></i> Ready <span class="count-badge" id="count-ready">0</span>
                    </button>
                    <button onclick="filterOrders('Completed', this)" data-status="completed" class="filter-tab flex items-center px-4 md:px-5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap text-brand-dark">
                        <i data-lucide="archive" class="w-4 h-4 mr-2"></i> Completed <span class="count-badge" id="count-completed">0</span>
                    </button>
                </div>
            </div>

            <div id="loading" class="text-center py-20 hidden">
                <div class="inline-block w-10 h-10 border-4 border-brand-lightGreen border-t-brand-terracotta rounded-full animate-spin"></div>
                <p class="mt-4 text-brand-dark/50 font-medium">Loading orders...</p>
            </div>
            <div id="empty-state" class="hidden text-center py-20 bg-white rounded-3xl border border-dashed border-brand-green/20 shadow-sm">
                <div class="bg-brand-lightGreen w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="inbox" class="w-10 h-10 text-brand-green"></i></div>
                <h3 class="text-xl font-serif font-bold text-brand-dark/70" id="empty-title">No orders yet</h3>
                <p class="text-brand-dark/50 text-sm mt-1" id="empty-subtitle">New orders will appear here automatically.</p>
            </div>
            <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        const scriptURL = "https://script.google.com/macros/s/AKfycbyUsPj419DZ5dbciSDtvcx0eBmtFNAAnwtXX0nX7vUMIBf1FjNlSW_FPodyxrruDk13/exec"; 
        let adminPassword = "";
        let isFetching = false;
        let allOrders = [];
        let currentFilter = "all";

        // ============ PASSWORD VISIBILITY TOGGLE ============
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // ============ PRESET MESSAGES ============
        const presetMessages = [
            { category: "greeting", text: "Namaste 🙏 Welcome to Chiya San! Your daily tea escape awaits. ☕" },
            { category: "greeting", text: "Good Morning! ☀️ Start your day the Chiya San way." },
            { category: "greeting", text: "Good Afternoon! Taking a break? We've got the perfect chiya for you. 🍵" },
            { category: "greeting", text: "Good Evening! 🌆 Wind down with a warm cup and good vibes." },
            { category: "greeting", text: "Hey there! 👋 Ready for the best chiya in Lalitpur?" },
            { category: "promo", text: "🎉 HAPPY HOUR! 20% off on all teas today from 2 PM to 4 PM. Don't miss out! ☕" },
            { category: "promo", text: "🎁 Buy 1 Get 1 FREE on all Milk Teas this weekend only! 🍵" },
            { category: "promo", text: "🔥 COMBO DEAL! Any Mo:Mo + Any Chiya = Rs. 250 only. Limited time offer!" },
            { category: "promo", text: "🌸 NEW ITEM ALERT! Try our refreshing Iced Lemon Tea today! 🍋" },
            { category: "promo", text: "💰 Student Special: Show your ID and get 15% off on all teas! 📚" },
            { category: "thanks", text: "Thank you for choosing Chiya San! 💚 We hope you enjoyed your experience. See you soon! ☕" },
            { category: "thanks", text: "Dhanyabad! 🙏 Your support means the world to us. Have a great day!" },
            { category: "thanks", text: "We noticed you ordered recently! Thank you for being a loyal customer. ❤️" },
            { category: "festival", text: "🪔 Happy Tihar! May your days be as sweet as our chiya. Come celebrate with us!" },
            { category: "festival", text: "🎊 Happy Dashain! Enjoy our special festival menu. Blessings to you and your family!" },
            { category: "festival", text: "🪔 Bhai Tika Special! Free Masala Chiya for every sibling pair today. 💚" },
            { category: "festival", text: "❄️ Winter is here! Warm up with our signature Masala Chiya. ❄️☕" },
            { category: "casual", text: "Sip, sip, hooray! 🎉 Your favorite chiya is waiting for you." },
            { category: "casual", text: "Life is short. Drink good chiya. ✨" },
            { category: "casual", text: "The chai break called — it misses you! ☕" },
            { category: "casual", text: "You + Chiya = Perfect Match 💚" },
            { category: "casual", text: "Freshly brewed happiness, made with love. Come grab yours! ☕" },
        ];

        function toggleBroadcast() { 
            const content = document.getElementById('broadcastContent'); 
            const chevron = document.getElementById('broadcastChevron'); 
            content.classList.toggle('hidden'); 
            chevron.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)'; 
        }
        
        function renderPresets(category = "all") { 
            const container = document.getElementById('presetContainer'); 
            container.innerHTML = ''; 
            const filtered = category === "all" ? presetMessages : presetMessages.filter(m => m.category === category); 
            filtered.forEach(msg => { 
                const btn = document.createElement('button'); 
                btn.className = 'preset-msg text-left bg-white border border-gray-200 rounded-xl p-3 text-sm text-brand-dark hover:shadow-sm'; 
                btn.innerText = msg.text; 
                btn.onclick = () => usePreset(msg.text, btn); 
                container.appendChild(btn); 
            }); 
        }
        
        function usePreset(text, btn) { 
            document.getElementById('broadcastMsg').value = text; 
            document.querySelectorAll('.preset-msg').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); 
        }
        
        function filterPresets(category, btn) { 
            document.querySelectorAll('.category-tab').forEach(b => { 
                b.classList.remove('bg-brand-green', 'text-white', 'active'); 
                b.classList.add('bg-brand-lightGreen', 'text-brand-dark'); 
            }); 
            btn.classList.remove('bg-brand-lightGreen', 'text-brand-dark'); 
            btn.classList.add('bg-brand-green', 'text-white', 'active'); 
            renderPresets(category); 
        }
        
        function clearBroadcast() { 
            document.getElementById('broadcastMsg').value = ''; 
            document.querySelectorAll('.preset-msg').forEach(b => b.classList.remove('active')); 
        }
        
        function sendBroadcast() { 
            const msg = document.getElementById('broadcastMsg').value; 
            if (!msg) { alert("Please pick a template or type a message first."); return; } 
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank'); 
        }

        // ============ GREET CUSTOMER ============
        function greetCustomer(customerName, customerPhone, orderId, total) {
            let cleanPhone = (customerPhone || '').toString().replace(/[^0-9]/g, '');
            if (!cleanPhone) { alert("This order doesn't have a phone number. Please contact the customer manually."); return; }
            if (cleanPhone.length === 10) { cleanPhone = '977' + cleanPhone; }
            
            const greetingMsg = `Namaste ${customerName}! 🙏\n\nThank you for ordering from *Chiya San*! ☕\n\nWe've received your order *${orderId}* worth *Rs. ${total}* and our team is on it. Your chiya will be ready very soon!\n\nHave a great day! 💚\n— Team Chiya San`;
            window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(greetingMsg)}`, '_blank');
        }

        // ============ LOGIN ============
        async function login() {
            const passwordInput = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const errorDiv = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');
            
            if (passwordInput.trim() === "") { 
                errorText.innerText = "Please enter your password.";
                errorDiv.classList.remove('hidden'); 
                return; 
            }
            
            loginBtnText.innerText = 'Verifying...';
            loginBtn.disabled = true; 
            errorDiv.classList.add('hidden');
            
            try {
                const response = await fetch(`${scriptURL}?password=${encodeURIComponent(passwordInput)}`);
                const data = await response.json();
                
                if (data.error && data.error.includes("Unauthorized")) { 
                    errorText.innerText = "Incorrect password. Please try again.";
                    errorDiv.classList.remove('hidden'); 
                } 
                else if (data.error) { 
                    errorText.innerText = "Server Error: " + data.error;
                    errorDiv.classList.remove('hidden'); 
                } 
                else {
                    adminPassword = passwordInput;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    renderPresets();
                    allOrders = data;
                    updateCounts();
                    renderOrders();
                }
            } catch (error) { 
                errorText.innerText = "Failed to connect. Please check your internet connection.";
                errorDiv.classList.remove('hidden'); 
            } 
            finally { 
                loginBtnText.innerText = 'Login to Dashboard';
                loginBtn.disabled = false; 
            }
        }

        function logout() { 
            adminPassword = ""; 
            allOrders = []; 
            currentFilter = "all"; 
            document.getElementById('dashboard').classList.add('hidden'); 
            document.getElementById('login-screen').classList.remove('hidden'); 
            document.getElementById('password').value = ''; 
            document.getElementById('login-error').classList.add('hidden'); 
        }

        // ============ ORDER FUNCTIONS ============
        async function updateOrderStatus(orderId, newStatus) {
            const updateData = { type: 'updateStatus', orderId: orderId, status: newStatus };
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updateData) });
                const order = allOrders.find(o => o['Order ID'] === orderId);
                if (order) order['Status'] = newStatus;
                updateCounts();
                renderOrders();
            } catch (error) { alert("Failed to update status."); }
        }

        async function fetchOrders() {
            if (isFetching) return;
            isFetching = true;
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            try {
                const response = await fetch(`${scriptURL}?password=${encodeURIComponent(adminPassword)}`);
                const data = await response.json();
                loading.classList.add('hidden');
                if (data.error) { 
                    document.getElementById('orders-grid').innerHTML = `<div class="col-span-full text-center text-red-500 py-10 font-bold">Error: ${data.error}</div>`; 
                    isFetching = false; 
                    return; 
                }
                allOrders = data;
                updateCounts();
                renderOrders();
            } catch (error) { loading.classList.add('hidden'); }
            finally { isFetching = false; }
        }

        function filterOrders(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(b => { b.classList.remove('active'); b.classList.add('text-brand-dark'); });
            btn.classList.add('active');
            btn.classList.remove('text-brand-dark');
            renderOrders();
        }

        function updateCounts() {
            const counts = { Pending: 0, Preparing: 0, Ready: 0, Completed: 0 };
            allOrders.forEach(o => { const s = o['Status'] || 'Pending'; if (counts[s] !== undefined) counts[s]++; });
            document.getElementById('count-all').innerText = allOrders.length;
            document.getElementById('count-pending').innerText = counts.Pending;
            document.getElementById('count-preparing').innerText = counts.Preparing;
            document.getElementById('count-ready').innerText = counts.Ready;
            document.getElementById('count-completed').innerText = counts.Completed;
        }

        function renderOrders() {
            const emptyState = document.getElementById('empty-state');
            const ordersGrid = document.getElementById('orders-grid');
            const emptyTitle = document.getElementById('empty-title');
            const emptySubtitle = document.getElementById('empty-subtitle');

            ordersGrid.innerHTML = '';

            let filtered = allOrders;
            if (currentFilter !== "all") { filtered = allOrders.filter(o => (o['Status'] || 'Pending') === currentFilter); }

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                if (currentFilter === "all") { 
                    emptyTitle.innerText = "No orders yet"; 
                    emptySubtitle.innerText = "New orders will appear here automatically."; 
                }
                else { 
                    emptyTitle.innerText = `No ${currentFilter} orders`; 
                    emptySubtitle.innerText = `There are currently no ${currentFilter.toLowerCase()} orders. Check other tabs.`; 
                }
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach((order) => {
                const date = new Date(order.Timestamp);
                const timeString = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const dateString = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                const formattedItems = (order['Items Ordered'] || '').replace(/\n/g, '<br>');
                const card = document.createElement('div');
                card.className = 'order-card bg-white rounded-2xl shadow-sm border border-brand-green/10 flex flex-col relative overflow-hidden';

                const currentStatus = order['Status'] || 'Pending';
                let statusBadge = '', badgeColor = '', barColor = '';
                if (currentStatus === 'Pending') { statusBadge = 'Pending'; badgeColor = 'bg-red-50 text-red-600 border-red-200'; barColor = 'bg-red-500'; }
                else if (currentStatus === 'Preparing') { statusBadge = 'Preparing'; badgeColor = 'bg-yellow-50 text-yellow-700 border-yellow-200'; barColor = 'bg-yellow-500'; }
                else if (currentStatus === 'Ready') { statusBadge = 'Ready!'; badgeColor = 'bg-green-50 text-green-700 border-green-200'; barColor = 'bg-green-500'; }
                else { statusBadge = 'Completed'; badgeColor = 'bg-gray-50 text-gray-600 border-gray-200'; barColor = 'bg-gray-400'; }

                const orderTypeColor = order['Order Type'] === 'Dine-In' ? 'bg-brand-green' : 'bg-brand-terracotta';
                const phone = order['Customer Phone'] || '';

                let actionButton = '';
                if (currentStatus === 'Pending') { actionButton = `<button onclick="updateOrderStatus('${order['Order ID']}', 'Preparing')" class="w-full bg-brand-lightGreen text-brand-green py-3 rounded-xl text-sm font-bold hover:bg-brand-green hover:text-white transition shadow-sm">Start Preparing</button>`; }
                else if (currentStatus === 'Preparing') { actionButton = `<button onclick="updateOrderStatus('${order['Order ID']}', 'Ready')" class="w-full bg-yellow-500 text-white py-3 rounded-xl text-sm font-bold hover:bg-yellow-600 transition shadow-sm">Mark as Ready</button>`; }
                else if (currentStatus === 'Ready') { actionButton = `<button onclick="updateOrderStatus('${order['Order ID']}', 'Completed')" class="w-full bg-green-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-green-700 transition shadow-sm">Mark as Completed</button>`; }
                else { actionButton = `<div class="w-full bg-gray-100 text-gray-500 py-3 rounded-xl text-sm font-bold text-center">✓ Order Completed</div>`; }

                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1.5 ${barColor}"></div>
                    <div class="p-4 md:p-5 flex-1 flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="inline-block bg-brand-cream text-brand-terracotta text-xs font-bold px-2.5 py-1 rounded-md tracking-wider mb-1">${order['Order ID']}</span>
                                <h3 class="font-serif font-bold text-lg md:text-xl text-brand-green leading-tight">${order['Customer Name']}</h3>
                                <div class="flex items-center gap-2 mt-1 flex-wrap">
                                    <span class="inline-block ${orderTypeColor} text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${order['Order Type']}</span>
                                    ${phone ? `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-brand-dark/60 bg-brand-cream px-2 py-0.5 rounded-full"><i data-lucide="phone" class="w-3 h-3"></i> ${phone}</span>` : ''}
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[11px] font-medium text-brand-dark/50 mb-1">${dateString} · ${timeString}</div>
                                <span class="inline-block border ${badgeColor} text-xs px-2.5 py-1 rounded-full font-bold">${statusBadge}</span>
                            </div>
                        </div>
                        <div class="bg-brand-cream/60 rounded-xl p-3 md:p-4 mb-4 flex-1">
                            <div class="text-[10px] font-bold text-brand-dark/40 uppercase tracking-wider mb-2">Items Ordered</div>
                            <div class="text-sm text-brand-dark font-medium leading-relaxed">${formattedItems}</div>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-3 md:pt-4 mb-3 md:mb-4">
                            <div class="flex items-center gap-1.5 text-xs font-medium text-brand-dark/60"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${order['Table / Pickup Time']}</div>
                            <div class="font-bold text-brand-green text-lg md:text-xl">Rs. ${order['Total Amount']}</div>
                        </div>
                        <button onclick="greetCustomer('${order['Customer Name'].replace(/'/g, "\\'")}', '${phone}', '${order['Order ID']}', '${order['Total Amount']}')" class="w-full bg-brand-lightTerracotta text-brand-terracotta py-3 rounded-xl text-sm font-bold hover:bg-brand-terracotta hover:text-white transition shadow-sm mb-3 flex items-center justify-center gap-2">
                            <i data-lucide="hand-heart" class="w-4 h-4"></i> Greet ${order['Customer Name'].split(' ')[0]}
                        </button>
                        ${actionButton}
                    </div>
                `;
                ordersGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        setInterval(() => { if (adminPassword !== "" && !document.getElementById('dashboard').classList.contains('hidden')) { fetchOrders(); } }, 60000);
    </script>
</body>
</html>
